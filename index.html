<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ ShopLive | Interactive Shopping Dashboard</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts for clean typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #1a1f2a 0%, #2a2f3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f0f4ff;
        }

        .shop-dashboard {
            max-width: 1300px;
            width: 100%;
            background: rgba(22, 28, 40, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 28px 32px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 2px #3e4b6b inset, 0 0 20px #5e7a9c;
            border: 1px solid #7a8db8;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2.4rem;
            filter: drop-shadow(0 4px 6px #00000055);
            animation: bounce 3s infinite ease-in-out;
        }

        .logo-text h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #d9e5ff, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text span {
            font-size: 0.9rem;
            font-weight: 400;
            color: #a8c0ff;
            display: block;
            margin-top: -4px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ca3c3c;
            padding: 8px 18px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px #ca3c3c88;
            border: 1px solid #ff9e9e;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #ffd966;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* Ticker tape */
        .ticker-wrap {
            background: #0f131c;
            border-radius: 60px;
            padding: 10px 20px;
            margin-bottom: 25px;
            border: 1px solid #4f5f7a;
            box-shadow: inset 0 2px 8px #00000055, 0 4px 12px #00000033;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .ticker {
            display: inline-block;
            animation: scrollTicker 30s linear infinite;
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            margin: 0 30px;
            font-weight: 500;
            color: #e2ecff;
        }

        .ticker-item i {
            margin-right: 8px;
            color: #a8c0ff;
            font-size: 1.1rem;
        }

        .price-up {
            color: #b5e6a3;
            font-weight: 700;
            margin-left: 8px;
        }

        .price-down {
            color: #f7b7a3;
            font-weight: 700;
            margin-left: 8px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1e2533;
            border-radius: 28px;
            padding: 18px 20px;
            border: 1px solid #5d6e8a;
            box-shadow: 0 8px 0 #0f131c, 0 12px 20px #00000044;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: #a8c0ff;
            box-shadow: 0 10px 0 #0f131c, 0 18px 30px #00000066;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a7b9d9;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #eef4ff;
            line-height: 1.2;
        }

        .stat-trend {
            font-size: 0.9rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .trend-up { color: #b5e6a3; }
        .trend-down { color: #f7b7a3; }

        /* Main content layout */
        .main-panel {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 25px;
        }

        /* Product list */
        .product-list {
            background: #1d2532;
            border-radius: 32px;
            padding: 22px 20px;
            border: 1px solid #537a7a;
            box-shadow: inset 0 0 20px #0f131c, 0 12px 25px #00000055;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #dbedff;
            letter-spacing: -0.3px;
        }

        .section-title i {
            color: #a8c0ff;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #232c3b;
            border-radius: 24px;
            margin-bottom: 12px;
            border-left: 6px solid #7a9bc0;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 4px 8px #00000022;
        }

        .product-item:hover {
            background: #2e394c;
            border-left-color: #c0d4ff;
            transform: scale(1.01);
        }

        .product-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .product-emoji {
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 4px #00000055);
        }

        .product-details h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e9f0ff;
        }

        .product-details p {
            font-size: 0.8rem;
            color: #acc0d9;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .product-price {
            text-align: right;
        }

        .price-main {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .price-change {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 30px;
            background: #141b24;
            display: inline-block;
            margin-top: 4px;
        }

        /* Right panel - cart / live activity */
        .live-activity {
            background: #1d2532;
            border-radius: 32px;
            padding: 22px 20px;
            border: 1px solid #537a7a;
            box-shadow: inset 0 0 20px #0f131c, 0 12px 25px #00000055;
            display: flex;
            flex-direction: column;
        }

        .activity-feed {
            flex: 1;
            overflow-y: auto;
            max-height: 340px;
            padding-right: 8px;
            margin-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: #6e8a9c #1a1f2a;
        }

        .activity-feed::-webkit-scrollbar {
            width: 6px;
        }

        .activity-feed::-webkit-scrollbar-track {
            background: #1a1f2a;
            border-radius: 10px;
        }

        .activity-feed::-webkit-scrollbar-thumb {
            background: #6e8a9c;
            border-radius: 10px;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #1f2937;
            border-radius: 18px;
            margin-bottom: 8px;
            border: 1px solid #3e4b6b;
            animation: fadeSlide 0.3s ease;
            font-size: 0.95rem;
        }

        .activity-type {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .buy-badge {
            color: #b5e6a3;
            background: #1e3d1e;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sell-badge {
            color: #f7b7a3;
            background: #4d2a1e;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .activity-price {
            font-weight: 700;
            color: #fff;
        }

        .activity-time {
            font-size: 0.7rem;
            color: #8fa5c0;
        }

        .order-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 16px 0;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #0b0e14;
            letter-spacing: 0.5px;
        }

        .btn-buy {
            background: #2a6b4a;
            color: #e0ffe8;
            border: 1px solid #7ad89a;
        }

        .btn-buy:hover {
            background: #3a8a5e;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #0b0e14;
        }

        .btn-sell {
            background: #8a3e2c;
            color: #ffe8e0;
            border: 1px solid #e69b7a;
        }

        .btn-sell:hover {
            background: #a54d37;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #0b0e14;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0b0e14;
        }

        /* Footer */
        .footer-note {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #8ba5c0;
            padding: 0 6px;
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-panel {
                grid-template-columns: 1fr;
            }
            .shop-dashboard {
                padding: 20px 18px;
            }
            .logo-text h1 {
                font-size: 1.6rem;
            }
            .stat-value {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .product-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .product-price {
                text-align: left;
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="shop-dashboard">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">🛍️</div>
                <div class="logo-text">
                    <h1>ShopLive</h1>
                    <span>interactive shopping dashboard</span>
                </div>
            </div>
            <div class="live-badge">
                <span class="live-dot"></span>
                <i class="fas fa-circle" style="font-size: 0.5rem; color: #ffd966;"></i> LIVE • 24/7
            </div>
        </div>

        <!-- Ticker -->
        <div class="ticker-wrap">
            <div class="ticker" id="ticker">
                <!-- Ticker items will be populated by JS -->
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-chart-line"></i> Market Index</div>
                <div class="stat-value" id="marketIndex">1,284</div>
                <div class="stat-trend trend-up"><i class="fas fa-arrow-up"></i> +2.4% today</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-trophy"></i> Top Category</div>
                <div class="stat-value" style="font-size: 1.8rem;" id="topCategory">Electronics</div>
                <div class="stat-trend trend-up"><i class="fas fa-star"></i> Best seller</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-weight-scale"></i> Avg. Order</div>
                <div class="stat-value" id="avgOrder">$142</div>
                <div class="stat-trend trend-up"><i class="fas fa-arrow-up"></i> +1.2%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-clock"></i> Orders (24h)</div>
                <div class="stat-value" id="orderVolume">1,842</div>
                <div class="stat-trend trend-up"><i class="fas fa-arrow-up"></i> +8.1%</div>
            </div>
        </div>

        <!-- Main content -->
        <div class="main-panel">
            <!-- Left: product list -->
            <div class="product-list">
                <div class="section-title">
                    <i class="fas fa-list-ul"></i> Live Product Listings
                </div>
                <div id="productList">
                    <!-- Product items will be generated here -->
                </div>
            </div>

            <!-- Right: live activity + cart buttons -->
            <div class="live-activity">
                <div class="section-title">
                    <i class="fas fa-bolt"></i> Recent Activity
                </div>
                <div class="activity-feed" id="activityFeed">
                    <!-- Activity items appear here -->
                </div>
                <div class="order-buttons">
                    <button class="btn btn-buy" id="buyBtn"><i class="fas fa-cart-plus"></i> ADD TO CART</button>
                    <button class="btn btn-sell" id="sellBtn"><i class="fas fa-credit-card"></i> CHECKOUT</button>
                </div>
                <div class="footer-note">
                    <span><i class="fas fa-shield-alt"></i> Secure checkout</span>
                    <span><i class="fas fa-sync-alt"></i> Real-time simulation</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // --- Data ---
            const products = [
                { name: 'Wireless Earbuds', emoji: '🎧', basePrice: 89.99, category: 'Electronics', stock: 45 },
                { name: 'Smart Watch', emoji: '⌚', basePrice: 199.99, category: 'Electronics', stock: 28 },
                { name: 'Coffee Maker', emoji: '☕', basePrice: 79.99, category: 'Home', stock: 62 },
                { name: 'Running Shoes', emoji: '👟', basePrice: 129.99, category: 'Fashion', stock: 33 },
                { name: 'Backpack', emoji: '🎒', basePrice: 59.99, category: 'Fashion', stock: 71 },
                { name: 'Desk Lamp', emoji: '💡', basePrice: 34.99, category: 'Home', stock: 88 },
                { name: 'Bluetooth Speaker', emoji: '🔊', basePrice: 149.99, category: 'Electronics', stock: 19 },
                { name: 'Water Bottle', emoji: '🥤', basePrice: 24.99, category: 'Sports', stock: 120 }
            ];

            // --- State (with price variations) ---
            let productData = products.map((product, index) => {
                const variation = Math.floor(Math.random() * 30) - 10;
                const currentPrice = product.basePrice + variation;
                const change = (Math.random() * 6 - 2).toFixed(1);
                return {
                    id: index + 1,
                    name: product.name,
                    emoji: product.emoji,
                    price: parseFloat(currentPrice.toFixed(2)),
                    change: parseFloat(change),
                    category: product.category,
                    stock: product.stock
                };
            });

            // --- DOM elements ---
            const tickerEl = document.getElementById('ticker');
            const productListEl = document.getElementById('productList');
            const activityFeedEl = document.getElementById('activityFeed');
            const marketIndexEl = document.getElementById('marketIndex');
            const orderVolumeEl = document.getElementById('orderVolume');

            // --- Helper: format currency ---
            function formatPrice(price) {
                return '$' + price.toFixed(2);
            }

            // --- Render product list ---
            function renderProductList() {
                let html = '';
                productData.forEach(product => {
                    const changeClass = product.change >= 0 ? 'price-up' : 'price-down';
                    const changeIcon = product.change >= 0 ? '▲' : '▼';
                    html += `
                        <div class="product-item" data-id="${product.id}">
                            <div class="product-info">
                                <div class="product-emoji">${product.emoji}</div>
                                <div class="product-details">
                                    <h3>${product.name}</h3>
                                    <p><i class="fas fa-tag"></i> ${product.category} · ${product.stock} in stock</p>
                                </div>
                            </div>
                            <div class="product-price">
                                <div class="price-main">${formatPrice(product.price)}</div>
                                <div class="price-change ${changeClass}">
                                    ${changeIcon} ${Math.abs(product.change).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                    `;
                });
                productListEl.innerHTML = html;

                // Add click listeners for demo interactivity
                document.querySelectorAll('.product-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        const id = this.dataset.id;
                        const product = productData.find(p => p.id == id);
                        if (product) {
                            // Add an activity for click
                            addActivity('VIEW', product.name, product.price);
                            // Slight price bump
                            product.price = parseFloat((product.price * 1.002).toFixed(2));
                            renderProductList();
                            updateStats();
                            flashItem(this);
                        }
                    });
                });
            }

            // --- Flash effect on click ---
            function flashItem(el) {
                el.style.transition = 'background 0.1s';
                el.style.background = '#4d5b6b';
                setTimeout(() => {
                    el.style.background = '';
                }, 150);
            }

            // --- Render ticker (scrolling) ---
            function renderTicker() {
                let tickerHtml = '';
                // Duplicate items for seamless scrolling
                const itemsToShow = [...productData, ...productData]; 
                itemsToShow.forEach(product => {
                    const changeClass = product.change >= 0 ? 'price-up' : 'price-down';
                    const changeSymbol = product.change >= 0 ? '+' : '';
                    tickerHtml += `
                        <span class="ticker-item">
                            <i class="fas fa-box"></i> ${product.name} ${formatPrice(product.price)}
                            <span class="${changeClass}">${changeSymbol}${product.change.toFixed(1)}%</span>
                        </span>
                    `;
                });
                tickerEl.innerHTML = tickerHtml;
            }

            // --- Add activity to feed (with current time) ---
            function addActivity(type, productName, price) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const activityItem = document.createElement('div');
                activityItem.className = 'activity-item';
                let badgeClass, icon, label;
                if (type === 'BUY') {
                    badgeClass = 'buy-badge';
                    icon = 'fa-cart-plus';
                    label = 'ADDED';
                } else if (type === 'SELL') {
                    badgeClass = 'sell-badge';
                    icon = 'fa-credit-card';
                    label = 'PURCHASED';
                } else {
                    badgeClass = 'buy-badge';
                    icon = 'fa-eye';
                    label = 'VIEWED';
                }
                activityItem.innerHTML = `
                    <div class="activity-type">
                        <span class="${badgeClass}"><i class="fas ${icon}"></i> ${label}</span>
                        <span>${productName}</span>
                    </div>
                    <div>
                        <span class="activity-price">${formatPrice(price)}</span>
                        <span class="activity-time">${time}</span>
                    </div>
                `;
                activityFeedEl.prepend(activityItem);
                // Keep max 12 activities
                if (activityFeedEl.children.length > 12) {
                    activityFeedEl.removeChild(activityFeedEl.lastChild);
                }
            }

            // --- Update live stats ---
            function updateStats() {
                // Market index based on average prices
                const avgPrice = productData.reduce((sum, p) => sum + p.price, 0) / productData.length;
                const indexValue = Math.floor(avgPrice * 5 + 500);
                marketIndexEl.textContent = indexValue.toLocaleString();

                // Order volume random increase
                let currentVolume = parseInt(orderVolumeEl.textContent.replace(/,/g, ''));
                currentVolume += Math.floor(Math.random() * 9) + 1;
                orderVolumeEl.textContent = currentVolume.toLocaleString();
            }

            // --- Simulate live market updates (every 3-4 seconds) ---
            function simulateMarket() {
                // Randomly pick a product and update price
                const randomIndex = Math.floor(Math.random() * productData.length);
                const product = productData[randomIndex];
                const changePercent = (Math.random() * 2.5 - 1.2);
                const oldPrice = product.price;
                let newPrice = oldPrice * (1 + changePercent / 100);
                newPrice = Math.max(10, Math.min(500, newPrice)); // clamp
                product.price = parseFloat(newPrice.toFixed(2));
                product.change = parseFloat(((newPrice - oldPrice) / oldPrice * 100).toFixed(1));
                
                // Update UI
                renderProductList();
                renderTicker();
                updateStats();

                // Randomly add an activity to feed
                if (Math.random() > 0.4) {
                    const type = Math.random() > 0.6 ? 'BUY' : (Math.random() > 0.5 ? 'SELL' : 'VIEW');
                    const randomProduct = productData[Math.floor(Math.random() * productData.length)];
                    addActivity(type, randomProduct.name, randomProduct.price);
                }

                // Update order volume
                orderVolumeEl.textContent = (parseInt(orderVolumeEl.textContent.replace(/,/g, '')) + Math.floor(Math.random() * 5) + 1).toLocaleString();
            }

            // --- Button handlers (for interactivity) ---
            document.getElementById('buyBtn').addEventListener('click', function() {
                const randomProduct = productData[Math.floor(Math.random() * productData.length)];
                addActivity('BUY', randomProduct.name, randomProduct.price);
                // Increase price slightly
                randomProduct.price = parseFloat((randomProduct.price * 1.005).toFixed(2));
                renderProductList();
                renderTicker();
                updateStats();
            });

            document.getElementById('sellBtn').addEventListener('click', function() {
                const randomProduct = productData[Math.floor(Math.random() * productData.length)];
                addActivity('SELL', randomProduct.name, randomProduct.price);
                // Decrease price slightly
                randomProduct.price = parseFloat((randomProduct.price * 0.995).toFixed(2));
                renderProductList();
                renderTicker();
                updateStats();
            });

            // --- Initialize everything ---
            function init() {
                // Initial render
                renderProductList();
                renderTicker();
                updateStats();

                // Seed initial activities
                const initialActivities = [
                    ['BUY', 'Wireless Earbuds', 92.50],
                    ['SELL', 'Smart Watch', 195.20],
                    ['VIEW', 'Coffee Maker', 82.00],
                    ['BUY', 'Running Shoes', 135.75],
                    ['SELL', 'Backpack', 58.30]
                ];
                initialActivities.forEach(([type, product, price]) => {
                    addActivity(type, product, price);
                });

                // Start simulation
                setInterval(simulateMarket, 3500);
            }

            // Start the app
            init();

        })();
    </script>
</body>
</html>
